# Hedging policies, policy assignment and calibration settings.
#
# Risk classes use internal names (CMDTY = bank RISK_TYPE CO). FX buckets follow the input naming (USDCAD).
# policies.<policy>.<RISK_CLASS>.<measure>:
#   instrument: same_factor            (market classes: hedge on the identical risk factor)
#               single_name            (CCS: CDS on the counterparty itself, rho_name 100%)
#               sector_proxy           (CCS: CDS on another name, same bucket & quality, rho_name 50%)
#               qualified_index        (CCS: qualified index in bucket 8, IG or HY by counterparty quality)
#   ratio:  hedge sensitivity as a fraction of the CVA sensitivity (missing entry = 0, i.e. unhedged)
#   sizing: cr01  -> s_Hdg = ratio * s_CVA
#           beta  -> s_Hdg = ratio * s_CVA * RW_counterparty / RW_hedge   (risk-weight matched; CCS only)
policies:
  # Nothing hedged.
  unhedged: {}

  # Unhedged names whose market delta is still hedged in full; no vega or credit hedge.
  unhedged_delta:
    IR.delta:    {instrument: same_factor, ratio: 1.0}
    IR.vega:     {instrument: same_factor, ratio: 0.0}
    FX.delta:    {instrument: same_factor, ratio: 1.0}
    FX.vega:     {instrument: same_factor, ratio: 0.0}
    RCS.delta:   {instrument: same_factor, ratio: 1.0}
    RCS.vega:    {instrument: same_factor, ratio: 0.0}
    EQ.delta:    {instrument: same_factor, ratio: 1.0}
    EQ.vega:     {instrument: same_factor, ratio: 0.0}
    CMDTY.delta: {instrument: same_factor, ratio: 1.0}
    CMDTY.vega:  {instrument: same_factor, ratio: 0.0}

  # SSA / MDB names (e.g. WORLD, the 7 SSAs): market delta 100%, vega not hedged,
  # credit 80% hedged by a different (dummy) name in the same sector & rating (IG/HY).
  specific_hedge:
    CCS.delta:   {instrument: sector_proxy, ratio: 0.8, sizing: cr01}
    IR.delta:    {instrument: same_factor, ratio: 1.0}
    IR.vega:     {instrument: same_factor, ratio: 0.0}
    FX.delta:    {instrument: same_factor, ratio: 1.0}
    FX.vega:     {instrument: same_factor, ratio: 0.0}
    RCS.delta:   {instrument: same_factor, ratio: 1.0}
    RCS.vega:    {instrument: same_factor, ratio: 0.0}
    EQ.delta:    {instrument: same_factor, ratio: 1.0}
    EQ.vega:     {instrument: same_factor, ratio: 0.0}
    CMDTY.delta: {instrument: same_factor, ratio: 1.0}
    CMDTY.vega:  {instrument: same_factor, ratio: 0.0}

  # Name-specific hedging (e.g. IPL): market delta 100%, vega 90%, credit 80% hedged by its own name.
  name_hedge:
    CCS.delta:   {instrument: single_name, ratio: 0.8, sizing: cr01}
    IR.delta:    {instrument: same_factor, ratio: 1.0}
    IR.vega:     {instrument: same_factor, ratio: 0.9}
    FX.delta:    {instrument: same_factor, ratio: 1.0}
    FX.vega:     {instrument: same_factor, ratio: 0.9}
    RCS.delta:   {instrument: same_factor, ratio: 1.0}
    RCS.vega:    {instrument: same_factor, ratio: 0.9}
    EQ.delta:    {instrument: same_factor, ratio: 1.0}
    EQ.vega:     {instrument: same_factor, ratio: 0.9}
    CMDTY.delta: {instrument: same_factor, ratio: 1.0}
    CMDTY.vega:  {instrument: same_factor, ratio: 0.9}

  # General counterparty population: market delta 100%, vega 90%,
  # credit 80% hedged by a different (dummy) name in the same sector & rating (IG/HY).
  sector_hedge:
    CCS.delta:   {instrument: sector_proxy, ratio: 0.8, sizing: cr01}
    IR.delta:    {instrument: same_factor, ratio: 1.0}
    IR.vega:     {instrument: same_factor, ratio: 0.9}
    FX.delta:    {instrument: same_factor, ratio: 1.0}
    FX.vega:     {instrument: same_factor, ratio: 0.9}
    RCS.delta:   {instrument: same_factor, ratio: 1.0}
    RCS.vega:    {instrument: same_factor, ratio: 0.9}
    EQ.delta:    {instrument: same_factor, ratio: 1.0}
    EQ.vega:     {instrument: same_factor, ratio: 0.9}
    CMDTY.delta: {instrument: same_factor, ratio: 1.0}
    CMDTY.vega:  {instrument: same_factor, ratio: 0.9}

# Policy of an existing counterparty, first match wins:
#   1. 'policy' column on its CVA rows in the book
#   2. counterparties map
#   3. ccs_buckets map (by SA-CVA sector bucket)
#   4. default
assignment:
  default: sector_hedge
  counterparties: {}          # e.g. {"WORLD": specific_hedge, "IPL": name_hedge, "IE1|C123": unhedged_delta}
  ccs_buckets:
    "1a": specific_hedge      # sovereigns, central banks, MDBs

calibration:
  trade_size: 1.0             # representative grids: units added before dividing back to per-unit
  # Counterparty-level RWs: per counterparty x risk type, a trade with the counterparty's own net sensitivity
  # profile scaled to a gross size of trade_size user units (1 = $1/bp CR01 or DV01 = 10,000 normalised;
  # $1 per 1% = 100 normalised) plus its policy hedge. RW = capital change per $1 user-unit sensitivity.
  counterparty:
    trade_size: 1.0
    units:                    # user unit per risk type (missing: per_bp for CCS/IR/RCS delta, per_1pct otherwise)
      CCS.delta: per_bp
      IR.delta: per_bp
      RCS.delta: per_bp
      FX.delta: per_1pct
      EQ.delta: per_1pct
      CMDTY.delta: per_1pct
      IR.vega: per_1pct
      FX.vega: per_1pct
      RCS.vega: per_1pct
      EQ.vega: per_1pct
      CMDTY.vega: per_1pct
    cluster_policies: [sector_hedge]   # clustered by sector x IG/HY; other policies reported per counterparty
  ccs:
    unit: per_bp              # unit trade = $1/bp CR01 = 10,000 normalised sensitivity
    tenor_profile: {"5Y": 1.0}   # representative CR01 split across tenors (sums to 1)
    buckets: ["1a", "1b", "2", "3", "4", "5", "6", "7"]
    qualities: [IG, HY]
  # market cells are priced for each direction of a unit CVA sensitivity (delta is signed by the trade)
  market_directions: {delta: [1, -1], vega: [1]}
  representative_factors:
    - {risk_class: IR,    measure: delta, bucket: CAD, risk_factor: 5Y,    unit: per_bp}
    - {risk_class: IR,    measure: delta, bucket: USD, risk_factor: 5Y,    unit: per_bp}
    - {risk_class: IR,    measure: vega,  bucket: CAD, risk_factor: IRVOL, unit: per_1pct}
    - {risk_class: IR,    measure: vega,  bucket: USD, risk_factor: IRVOL, unit: per_1pct}
    - {risk_class: FX,    measure: delta, bucket: USDCAD, risk_factor: "", unit: per_1pct}
    - {risk_class: FX,    measure: vega,  bucket: USDCAD, risk_factor: "", unit: per_1pct}
    - {risk_class: RCS,   measure: delta, bucket: "3", risk_factor: "",    unit: per_bp}
    - {risk_class: RCS,   measure: vega,  bucket: "3", risk_factor: "",    unit: per_1pct}
    - {risk_class: EQ,    measure: delta, bucket: "5", risk_factor: "",    unit: per_1pct}
    - {risk_class: EQ,    measure: vega,  bucket: "5", risk_factor: "",    unit: per_1pct}
    - {risk_class: CMDTY, measure: delta, bucket: "2", risk_factor: "",    unit: per_1pct}
    - {risk_class: CMDTY, measure: vega,  bucket: "2", risk_factor: "",    unit: per_1pct}
